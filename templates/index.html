<!DOCTYPE html>
<html>
<head>
    <title>Placement Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>Placement Prediction</h1>

    <form action="/predict" method="post">

        <input
            type="number"
            step="0.01"
            name="degree_p"
            placeholder="Degree Percentage"
            required
        >

        <input
            type="number"
            step="0.01"
            name="mba_p"
            placeholder="MBA Percentage"
            required
        >

        <button type="submit">
            Predict
        </button>

    </form>
   
    {% if prediction %}
    <h2>{{ prediction }}</h2>
    <h3>Chance of Placement: {{ probability }}%</h3>
    {% endif %}

</div>

</body>
</html>
